name: Android Build

on:
  push:
    branches: [ "v8" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Commit
        uses: actions/checkout@v4

      - name: Clone Arc (mindustry-antigrief fork)
        run: git clone https://github.com/mindustry-antigrief/Arc ../Arc

      - name: Set up JDK 20
        uses: actions/setup-java@v4
        with:
          java-version: 20
          distribution: temurin

      - name: Setup Gradle Caching
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Pack sprites
        run: ./gradlew tools:pack --info

      - name: Build Android APK
        run: ./gradlew android:assembleDebug -x minifyDebugWithR8 -x shrinkDebugRes --no-build-cache --info

      - name: List android build output
        run: |
          echo "=== android/build/outputs ==="
          find android/build/outputs -type f 2>/dev/null || echo "outputs dir missing"
          echo "=== all APKs anywhere ==="
          find . -name "*.apk" 2>/dev/null || echo "no apk found"

      - name: Find APK
        id: find_apk
        run: |
          APK=$(find . -name "*.apk" 2>/dev/null | head -1)
          echo "path=$APK" >> $GITHUB_OUTPUT
          echo "Found: $APK"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mindustry-client-android
          path: ${{ steps.find_apk.outputs.path }}
          retention-days: 14

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: build-${{ github.run_number }}
          release_name: Android Build ${{ github.run_number }}
          body: |
            Автосборка #${{ github.run_number }}
            Коммит: ${{ github.sha }}
          draft: false
          prerelease: true

      - name: Upload APK to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ steps.find_apk.outputs.path }}
          asset_name: mindustry-client-android.apk
          asset_content_type: application/vnd.android.package-archive
