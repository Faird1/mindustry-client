name: Android Build

on:
  push:
    branches: [ "v8" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Commit
        uses: actions/checkout@v4

      - name: Clone Arc (mindustry-antigrief fork)
        run: git clone https://github.com/mindustry-antigrief/Arc ../Arc

      - name: Set up JDK 20
        uses: actions/setup-java@v4
        with:
          java-version: 20
          distribution: temurin

      - name: Setup Gradle Caching
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Pack sprites
        run: ./gradlew tools:pack

      - name: Build Android APK
        run: ./gradlew android:assembleDebug -x minifyDebugWithR8 -x shrinkDebugRes --no-build-cache

      - name: Find APK location
        run: |
          echo "=== android/build tree ==="
          find android/build -type f 2>/dev/null | sort
          echo "=== deploy dirs ==="
          find . -maxdepth 4 -name "deploy" -type d 2>/dev/null
          echo "=== all APKs on system ==="
          find /home/runner/work -name "*.apk" 2>/dev/null | head -20
