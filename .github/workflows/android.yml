name: Android Build

on:
  push:
    branches: [ "v8" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Commit
        uses: actions/checkout@v4

      - name: Clone Arc (mindustry-antigrief fork)
        run: git clone https://github.com/mindustry-antigrief/Arc ../Arc

      - name: Set up JDK 20
        uses: actions/setup-java@v4
        with:
          java-version: 20
          distribution: temurin

      - name: Setup Gradle Caching
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Pack sprites
        run: ./gradlew tools:pack

      - name: Build Android APK
        run: ./gradlew android:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mindustry-client-android
          path: android/build/outputs/apk/**/*.apk
          retention-days: 14      - name: Build Android APK
        run: ./gradlew android:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mindustry-client-android
          path: android/build/outputs/apk/**/*.apk
          retention-days: 14
