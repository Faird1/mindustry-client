name: Android Build

on:
  push:
    branches: ["v8"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show android/build.gradle
        run: cat android/build.gradle

      - name: Clone Arc (mindustry-antigrief fork)
        run: git clone https://github.com/mindustry-antigrief/Arc ../Arc

      - name: Set up JDK 20
        uses: actions/setup-java@v4
        with:
          java-version: 20
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Pack sprites
        run: ./gradlew tools:pack

      - name: Touch timestamp
        run: touch /tmp/build_start

      - name: Build Android APK
        run: |
          ./gradlew android:assembleDebug \
            -x minifyDebugWithR8 \
            -x shrinkDebugRes \
            --no-build-cache \
            --no-configuration-cache

      - name: Find APK
        id: find_apk
        run: |
          echo "=== output-metadata.json ==="
          cat android/build/outputs/apk/debug/output-metadata.json 2>/dev/null || true

          echo "=== Files newer than build start, >1MB ==="
          find /home/runner/work -newer /tmp/build_start -size +1M -type f 2>/dev/null \
            | grep -v "/sdk/\|/platforms/\|/emulator/\|/build-tools/\|\.ogg\|\.mp3\|\.aatls" \
            | sort

          echo "=== All *.apk anywhere ==="
          find / -name "*.apk" 2>/dev/null | grep -v "/sdk/\|/platforms/\|/emulator/\|/build-tools/"

          # Пытаемся найти APK
          APK=$(find / -name "*.apk" 2>/dev/null \
            | grep -v "/sdk/\|/platforms/\|/emulator/\|/build-tools/" \
            | head -1)

          if [ -n "$APK" ]; then
            echo "apk_path=$APK" >> $GITHUB_OUTPUT
            echo "Found APK: $APK"
            exit 0
          fi

          # Ищем крупный файл созданный во время сборки (APK без расширения или с нестандартным именем)
          CANDIDATE=$(find /home/runner/work -newer /tmp/build_start -size +5M -type f 2>/dev/null \
            | grep -v "\.ogg\|\.mp3\|\.aatls\|\.so\|\.jar\|\.class\|\.png\|\.ap_" \
            | head -1)

          if [ -n "$CANDIDATE" ]; then
            echo "Found candidate file: $CANDIDATE"
            file "$CANDIDATE"
            # APK — это ZIP, проверяем
            if unzip -t "$CANDIDATE" 2>/dev/null | grep -q "AndroidManifest"; then
              cp "$CANDIDATE" /tmp/mindustry-client-debug.apk
              echo "apk_path=/tmp/mindustry-client-debug.apk" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          echo "::error::APK not found. See logs above to determine custom outputDirectory."
          exit 1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mindustry-client-debug-${{ github.run_number }}
          path: ${{ steps.find_apk.outputs.apk_path }}
          if-no-files-found: error

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "Android build #${{ github.run_number }}"
          files: ${{ steps.find_apk.outputs.apk_path }}
          generate_release_notes: true
