name: Android Build

on:
  push:
    branches: ["v8"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone Arc (mindustry-antigrief fork)
        run: git clone https://github.com/mindustry-antigrief/Arc ../Arc

      - name: Set up JDK 20
        uses: actions/setup-java@v4
        with:
          java-version: 20
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Pack sprites
        run: ./gradlew tools:pack

      - name: Build Android APK
        run: |
          ./gradlew android:assembleDebug \
            -x minifyDebugWithR8 \
            -x shrinkDebugRes \
            --no-build-cache \
            --no-configuration-cache \
            --info 2>&1 | grep -E "(Task|apk|APK|output|packageDebug|error)" | tail -50

      # Показываем output-metadata.json — в нём прописано имя APK
      - name: Cat output-metadata.json
        run: |
          cat android/build/outputs/apk/debug/output-metadata.json || echo "not found"

      # Явно запускаем packageDebug с --info чтобы увидеть что он реально делает
      - name: Run packageDebug with full info
        run: |
          ./gradlew android:packageDebug \
            -x minifyDebugWithR8 \
            -x shrinkDebugRes \
            --no-build-cache \
            --info 2>&1 | grep -E "(output|apk|APK|write|copy|file|path)" | head -40

      - name: Find any APK
        id: find_apk
        run: |
          APK=$(find / -name "*.apk" 2>/dev/null \
            | grep -v "/sdk/\|/platforms/\|/emulator/\|/build-tools/" \
            | head -1)
          if [ -n "$APK" ]; then
            echo "apk_path=$APK" >> $GITHUB_OUTPUT
            echo "Found: $APK"
          else
            echo "Still not found — listing intermediates/apk* tree:"
            find android/build/intermediates -maxdepth 3 -type d | sort
            # Пробуем собрать вручную: zip компоненты в apk
            echo "Attempting manual APK assembly..."
            ls android/build/intermediates/apk/ 2>/dev/null || true
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mindustry-client-debug-${{ github.run_number }}
          path: ${{ steps.find_apk.outputs.apk_path }}
          if-no-files-found: error

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "Android build #${{ github.run_number }}"
          files: ${{ steps.find_apk.outputs.apk_path }}
          generate_release_notes: true
